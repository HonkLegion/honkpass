title = "HonkPass repository secrets"
minVersion = "v8.30.1"

[extend]
useDefault = true

# Keep the standard rules. Exceptions require both the exact path and a known value.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Synthetic organization account used only by local Vaultwarden"
condition = "AND"
paths = ['''^support/vaultwarden/test-account-organization\.json$''']
regexTarget = "secret"
regexes = ['''^synthetic-bynAAXitCjM9rWVeVPD3LZj2$''']

[[rules.allowlists]]
description = "Nonfunctional wrapped-key placeholder in token parser tests"
condition = "AND"
paths = ['''^Tests/EngineLiveTests/TokenResponseTests\.swift$''']
regexTarget = "secret"
regexes = ['''^2\.wrapped-private-key$''']

[[rules.allowlists]]
description = "SHA-256 checksums of committed artwork in the license inventory"
condition = "AND"
paths = ['''^App/PassVault/Legal/inventory\.json$''']
regexTarget = "line"
regexes = ['''^\s*"(?:Sources/DesignKit/Resources/Illustrations/[^"\r\n]+\.(?:png|svg)|App/PassVault/AppIcon\.icon/Assets/GooseKey\.png)": "[a-f0-9]{64}",?\s*$''']
